<div class="row">
  <div class="col-md-5">
    <app-recipe-list
      (recipeSelected)="onRecipeSelected($event)"
    ></app-recipe-list>
  </div>
  <div class="col-md-7">
    @if (selectedRecipe) {
      <app-recipe-detail
        [selectedRecipeDetails]="selectedRecipe"
      ></app-recipe-detail>
    } @else {
      <ng-container [ngTemplateOutlet]="infoText"></ng-container>
    }
    <ng-template #infoText>
      <p>Please select a Recipe!</p>
    </ng-template>
  </div>
</div>
