<app-header (selectNavigation)="onSelectNavigation($event)"></app-header>
<div class="container">
  <div class="row">
    <div class="col-md-12">
      @if (destination === "Recipes") {
        <app-recipes></app-recipes>
      } @else if (destination === "Shopping List") {
        <app-shopping-list></app-shopping-list>
      }
    </div>
  </div>
</div>
